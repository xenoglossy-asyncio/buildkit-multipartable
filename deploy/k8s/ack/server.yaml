# ACK dtbuild API Server.
# Contexts stored in OSS (S3-compatible endpoint).
# Optionally use ACR as output image registry.
---
apiVersion: v1
kind: Secret
metadata:
  name: dtbuild-auth
stringData:
  api-key: "change-me-in-production"
---
apiVersion: v1
kind: Secret
metadata:
  name: s3-credentials
stringData:
  access-key: "<your-oss-access-key>"
  secret-key: "<your-oss-secret-key>"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dtbuild-server-pvc
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: { storage: 50Gi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dtbuild-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dtbuild-server
  template:
    metadata:
      labels:
        app: dtbuild-server
    spec:
      containers:
        - name: server
          image: dtbuildkit:latest
          command: ["/app/dtbuild-server"]
          args:
            - "--addr=:8640"
            - "--db=/data/dtbuildkit.db"
          env:
            - name: S3_ENDPOINT
              value: oss-cn-hangzhou.aliyuncs.com
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef: { name: s3-credentials, key: access-key }
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef: { name: s3-credentials, key: secret-key }
            - name: S3_BUCKET
              value: dtbuildkit
            - name: DTBUILD_API_KEYS
              valueFrom:
                secretKeyRef: { name: dtbuild-auth, key: api-key }
          ports:
            - containerPort: 8640
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: dtbuild-server-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: dtbuild-server
spec:
  selector: { app: dtbuild-server }
  ports:
    - port: 8640
      targetPort: 8640
